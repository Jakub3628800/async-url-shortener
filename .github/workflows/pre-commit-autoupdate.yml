name: Auto-Update pre-commit Hooks

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Update stable hooks
        run: |
          pre-commit autoupdate --repo https://github.com/pre-commit/pre-commit-hooks
          pre-commit autoupdate --repo https://github.com/astral-sh/ruff-pre-commit
          pre-commit autoupdate --repo https://github.com/astral-sh/uv-pre-commit
          pre-commit autoupdate --repo https://github.com/hadolint/hadolint
          pre-commit autoupdate --repo https://github.com/rhysd/actionlint

      - name: Check for changes
        id: changes
        run: |
          git add .pre-commit-config.yaml
          git diff --staged --quiet || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "chore: Pre-commit auto-update"
          body: "Automated update of pre-commit hooks"
          branch: "pre-commit-autoupdate"
          base: "master"
          labels: dependencies,github_actions
          sign-commits: true
          assignees: Jakub3628800
          reviewers: Jakub3628800
