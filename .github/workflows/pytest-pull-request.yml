# This workflow runs pytest on the service code
name: Pytest Pull Request workflow

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master, test-gh-action ]

#set environment variables
permissions:
  contents: read

jobs:

  pytest_with_coverage:
    # Run pytest, upload coverage to a githubs gist so that badge can display it

    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: urldatabase

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.14'
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
    - name: Install dependencies
      run: uv sync --all-extras

    - name: Test with pytest
      run: uv run pytest --cov=shortener
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_DATABASE: urldatabase
        DB_USER: postgres
        DB_PASSWORD: pass
